name: Release

# 发布二进制部署 bundle（见 docs/RELEASE.md）。
#
# 完全自动化：推送 `vX.Y.Z` 形态的 tag 后，本工作流在 Linux 上自动完成
#   构建静态站 → 打自包含 bundle → 创建 GitHub Release（说明取自 CHANGELOG）
#   → 上传全部部署附件。
# 全程不需要在开发机手工构建，也不需要手工 `gh release create` / `gh release upload`。
#
# 为什么必须自动化：toolboxctl upgrade / 一键安装依赖 Release 附件里的
# latest.txt、toolbox-<ver>-linux-amd64.tar.gz 及其 .sha256、index.json、install.sh；
# HTTPS 源无法列目录，缺 latest.txt 时 `toolboxctl upgrade` 会报
# 「无法解析可用版本（缺 latest.txt 且无包列表）」。这些产物只能在 Linux 上由
# deploy/binary/build-bundle.sh 打出（需要 tar/gzip/sha256sum），手工上传必漏。
on:
  push:
    tags:
      # 只认真实版本号形态（v0.0.2 / v1.2.3 / v0.0.2-rc.1 都匹配），
      # 避免 vanilla、v-test 之类随手打的 v 开头 tag 误触发正式发版。
      - "v[0-9]*.[0-9]*.[0-9]*"
  # 仅用于给「已存在但附件缺失」的旧 tag 手动补发；正常发布走上面的 tag push，无需手动
  workflow_dispatch:
    inputs:
      tag:
        description: "要补发附件的版本 tag（如 v0.0.2）"
        required: true
        default: "v0.0.2"

# 创建 Release 与上传附件需要 contents 写权限
permissions:
  contents: write

# 同一 tag 的发布串行：tag push 与手动补发若同时发生，不取消在跑的发布
# （中途取消可能留下传了一半的附件），而是排队，避免 gh release upload 互相踩踏。
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    # 正常构建+打包+发布约 2 分钟；超过 15 分钟判定为卡死，避免空跑占用额度。
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # 推 tag 时构建该 tag；手动补发时构建输入框指定的 tag
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      # 发版前强制对齐 tag 与 deploy/binary/VERSION：包名 / latest.txt / index.json
      # 都取自 VERSION，一旦与 tag 不符就会「绿勾发错版」，把旧版本附件挂到新 tag 下，
      # 直接搞乱 upgrade 源。这里在耗时构建之前就失败。
      # 手动补发旧 tag 时 checkout 已切到该 tag 的提交，其 VERSION 仍是旧值，故不会误伤补发。
      - name: Verify tag matches VERSION
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VER=${RELEASE_TAG#v}
          FILE_VER=$(tr -d ' \t\r\n' < deploy/binary/VERSION)
          if [ "$FILE_VER" != "$VER" ]; then
            echo "::error::tag 为 $RELEASE_TAG，但 deploy/binary/VERSION 为 $FILE_VER。发版前请先把 VERSION 改成 $VER 并提交。"
            exit 1
          fi
          echo "版本一致：$RELEASE_TAG == $FILE_VER"

      - name: Build static site (sitemap -> client -> SSR -> prerender)
        env:
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://006336.xyz' }}
        run: pnpm build:ssg

      - name: Package self-contained bundle
        # 复用上面 build:ssg 已产出的 apps/web/dist（含 sitemap/robots/预渲染页），
        # 这里只负责组装 + 校验和 + 打包，避免 build-bundle 内部再跑一遍不完整的构建。
        run: bash deploy/binary/build-bundle.sh --skip-build

      - name: Create GitHub Release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # 去掉 v 前缀，对齐 CHANGELOG 标题与 bundle 文件名（0.0.2 而非 v0.0.2）
          VER=${RELEASE_TAG#v}
          NOTES_FILE=$(mktemp)

          # Release 说明优先取 CHANGELOG.md 中 `## [<ver>]` 这一节（到下一个二级标题为止）；
          # CHANGELOG 里没有该版本时，回落到 GitHub 自动生成的提交说明，不让发布失败。
          awk -v header="## [$VER]" '
            index($0, header) == 1 { cap = 1; print; next }
            cap && $0 ~ /^## \[/ { exit }
            cap { print }
          ' CHANGELOG.md > "$NOTES_FILE"

          if [ -s "$NOTES_FILE" ]; then
            echo "使用 CHANGELOG 的 [$VER] 段落作为 Release 说明"
            NOTE_ARGS=(--notes-file "$NOTES_FILE")
          else
            echo "CHANGELOG 未找到 [$VER] 段落，使用 GitHub 自动生成说明"
            NOTE_ARGS=(--generate-notes)
          fi

          # Release 已存在（手动补发旧 tag）时保留原说明，只刷新附件；
          # 不存在则随本次 tag push 一并创建，标题即 tag 名。
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG 已存在：保留现有说明，仅刷新附件"
          else
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" "${NOTE_ARGS[@]}"
          fi

          gh release upload "$RELEASE_TAG" \
            dist-release/toolbox-*-linux-amd64.tar.gz \
            dist-release/toolbox-*-linux-amd64.tar.gz.sha256 \
            dist-release/latest.txt \
            dist-release/index.json \
            dist-release/install.sh \
            --clobber

          echo "已发布：https://github.com/${GITHUB_REPOSITORY}/releases/tag/$RELEASE_TAG"
