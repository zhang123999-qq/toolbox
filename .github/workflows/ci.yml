name: CI

# 分支名以实际默认分支为准：此前写成 main，而仓库默认分支是 master，
# 结果 push 触发的 CI 从未跑过（只有开 PR 才会跑）。
on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # 不写 version：package.json 的 packageManager 是 pnpm 版本的唯一真源。
        # 两处都指定会让 action v4 直接失败（Multiple versions of pnpm specified）。
        # 这个坑此前一直被「push 不触发 CI」掩盖着——第一次真正跑就挂在第 3 步。

      - uses: actions/setup-node@v4
        with:
          # 不用 20：测试环境 jsdom@30 的 engines 是 ^22.22.2 || ^24.15.0 || >=26.0.0，
          # 其依赖 undici@8 要求 >=22.19.0，Node 20 上 jsdom 环境根本起不来
          # （表现为 webidl.util.markAsUncloneable is not a function）。
          node-version: 24
          cache: pnpm

      - name: Install
        # --ignore-scripts：esbuild 的 postinstall 在受限环境下会 EBUSY，
        # 而它的二进制来自平台可选包，不需要该脚本（DEVELOPMENT.md §18.3）。
        run: pnpm install --frozen-lockfile --ignore-scripts

      # 门禁顺序见 DEVELOPMENT.md §十：静态检查在前，慢的在后。
      - name: Check tool metadata
        run: pnpm check:tools

      - name: Check docs consistency
        run: pnpm check:docs

      # 部署脚本此前没有任何自动化校验：语法错只有在目标机上才暴露。
      # 顺带机检「发布源默认值」在 install.sh / toolboxctl / 文档里是同一个值，
      # 防止改一处漏一处（脚本本体见 deploy/binary/tests/verify-release-source.sh）。
      - name: Check deployment scripts
        run: |
          bash -n deploy/binary/install.sh
          bash -n deploy/binary/toolboxctl
          sh deploy/binary/tests/verify-release-source.sh

      # 守住「只使用宽松许可的依赖」：GPL / AGPL / SSPL / BUSL 等会直接失败
      - name: Check dependency licenses
        run: pnpm check:licenses

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # SSG：不补预渲染，870 个工具页对爬虫就是空壳（DEVELOPMENT.md §十二）
      # build:ssg = 客户端构建 + SSR 构建 + 预渲染，三步顺序不能反。
      - name: Build (client + SSR + prerender)
        run: pnpm build:ssg
        env:
          # 默认域名来自 packages/catalog/src/site.ts；部署到别处用仓库变量覆盖
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://006336.xyz' }}

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
