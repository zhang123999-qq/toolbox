name: CI

# 分支名以实际默认分支为准：此前写成 main，而仓库默认分支是 master，
# 结果 push 触发的 CI 从未跑过（只有开 PR 才会跑）。
on:
  push:
    branches: [master, main]
  pull_request:

# 只读仓库即可：CI 不需要写权限，按最小权限收敛默认 GITHUB_TOKEN。
# （dependency-review job 在 job 级别单独声明 pull-requests: write。）
permissions:
  contents: read

# 同一 ref 连续推送时取消旧的验证 run，只保留最新一次，省额度也避免排队。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 完整验证（fast-gates / test / build 并行 + 聚合 verify，见 verify.yml）
  verify:
    uses: ./.github/workflows/verify.yml

  # Docker 镜像冒烟：构建生产镜像 → 用 docker-compose 起 → /healthz 与 smoke 都过。
  # 与 verify 并行（无 needs），镜像坏了不等测试跑完才发现。
  docker-smoke:
    name: Docker smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build image (load)
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: toolbox:ci
          # CI 走 npmjs：.npmrc 的 npmmirror 是本地优化，GH runner 上慢
          build-args: |
            SITE_ORIGIN=${{ vars.SITE_ORIGIN || 'https://006336.xyz' }}
            COREPACK_NPM_REGISTRY=https://registry.npmjs.org
          cache-from: type=gha,scope=toolbox-web
          cache-to: type=gha,mode=max,scope=toolbox-web

      # smoke.mjs 需要 Node（runner 自带版本不可控，显式声明与 .nvmrc 一致）
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Start container (compose)
        env:
          # compose 的 image 是 toolbox:${VERSION:-latest}，用 VERSION=ci 对上上面打的 tag
          VERSION: ci
        run: |
          set -euo pipefail
          docker compose up -d --no-build toolbox
          # 等 /healthz（nginx 新容器起来需要几秒，轮询 60 次）
          for i in $(seq 1 60); do
            if wget -qO- http://127.0.0.1:8081/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done
          BODY=$(wget -qO- http://127.0.0.1:8081/healthz)
          VER=$(tr -d ' \t\r\n' < deploy/binary/VERSION)
          echo "healthz: $BODY"
          [ "$BODY" = "ok v${VER}" ] || { echo "::error::healthz 不符（期望 ok v${VER}）"; docker compose logs toolbox || true; exit 1; }

      - name: HTTP smoke (deploy/docker/smoke.mjs)
        env:
          SMOKE_BASE_URL: http://127.0.0.1:8081
          # nginx 模式：未知路径是硬 404（SPA_FALLBACK 未设置）
        run: node deploy/docker/smoke.mjs

      - name: Stop container
        if: always()
        env:
          VERSION: ci
        run: docker compose down

  # E2E：真实浏览器跑 e2e.spec.ts（799 个工具页）。首版 1 shard；
  # 耗时超过 8 分钟再加 --shard（见 apps/web/playwright.config.ts）。
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: ./.github/actions/setup

      - name: Cache Playwright browsers
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}-1.63.0

      - name: Install Chromium (+ system deps)
        run: pnpm --filter @toolbox/web exec playwright install --with-deps chromium

      - name: Build (client + SSR + prerender)
        run: pnpm build:ssg
        env:
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://006336.xyz' }}

      - name: Run E2E
        run: pnpm --filter @toolbox/web exec playwright test

      - name: Upload trace/artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-report
          path: apps/web/test-results
          retention-days: 14

  # 依赖审计：起点非阻塞（xlsx 有 2 个 high 无官方补丁，见 package.json 注释）。
  # 替换掉 xlsx 后再去掉 continue-on-error 转门禁。
  audit:
    name: Audit (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: ./.github/actions/setup

      - name: pnpm audit
        run: pnpm --registry=https://registry.npmjs.org audit --prod --audit-level=high 2>&1 | tee audit-output.txt

      - name: Upload audit output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: audit-output
          path: audit-output.txt
          retention-days: 14

  # PR 维度依赖审查：只拦 PR 新引入的漏洞（免费）。critical 起步，
  # xlsx 的 high 已登记跟踪 issue，high 门禁随其替换一并收紧。
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Dependency review
        uses: actions/dependency-review-action@40c09b7dc99638e5ddb0bfd91c1673effc064d8a # v4.8.1
        with:
          fail-on-severity: critical

  # workflow 语法自查：改 workflow 时的提交前关卡（pint/actionlint 同类问题最早拦截点）。
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$HOME/go/bin/actionlint"
