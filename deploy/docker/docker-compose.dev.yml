services:
  web:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        # 构建期如需代理，在此传入（不写入镜像层）
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
    image: toolbox-web:dev
    container_name: toolbox-web
    ports:
      - "8080:80"
    restart: unless-stopped
    # exec 数组形式不做 shell 解析：`">/dev/null"` 会被当成第三个 URL 传给 wget，
    # 结果容器永远 unhealthy。要么 CMD-SHELL，要么不写重定向。
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
