server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # gzip：含 WASM 与 JSON-LD，注意 wasm 必须显式声明
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    # 注意：text/html 是 nginx 的内置默认值，重复声明会产生
    # "duplicate MIME type" 警告，此处不要写。
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json
        application/wasm
        image/svg+xml;

    charset utf-8;

    # MIME：继承 http 级的 /etc/nginx/mime.types（nginx 1.21+ 已内置
    # application/wasm），不要在 server 级写 types { } 块——它会**覆盖**
    # 继承来的整张表，导致 html/css/js 掉回 application/octet-stream，
    # 并让 gzip 因类型不匹配而静默失效。

    # 带 hash 的构建产物：长缓存 + immutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # WASM 大模块：CacheFirst 策略的服务端配合
    location /wasm/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # sitemap / robots：不可长缓存
    location ~ ^/(sitemap\.xml|robots\.txt)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # —— 健康检查端点 ——
    # 与二进制部署形态（conf/nginx.conf.tpl）保持一致：编排系统与
    # toolboxctl health 都依赖它判定实例是否就绪，缺失会让 Docker 形态
    # 无法被统一探测（曾出现过：二进制有 /healthz、容器返回 404）。
    # 版本号随响应返回，作为「当前跑的到底是哪一版」的证据。
    # @TOOLBOX_VERSION@ 在构建期由 Dockerfile 按 deploy/binary/VERSION 注入。
    location = /healthz {
        access_log off;
        add_header Cache-Control "no-store";
        default_type text/plain;
        return 200 "ok v@TOOLBOX_VERSION@\n";
    }

    # 未知路径返回**真正的 404 状态码**，并渲染 SSG 产出的 404.html。
    # 必须显式指定：若像早期版本那样把 /index.html 当兜底，所有拼错的 URL
    # 都会以 200 + 首页内容返回（软 404），对搜索引擎是明确的反模式。
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
    }

    # 静态路由：先精确文件，再目录 index.html（SSG 产物形态），最后交 404。
    # 注意用 $uri/index.html 而不是 $uri/ —— 后者会命中 index 模块的
    # 「目录自动补斜杠」逻辑，对 /tools 返回 301 → /tools/，
    # 与 SSG 产物的 canonical（无尾斜杠）不一致，还多一跳。
    location / {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache";
    }
}
