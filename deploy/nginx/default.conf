server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # gzip：含 WASM 与 JSON-LD，注意 wasm 必须显式声明
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    # 注意：text/html 是 nginx 的内置默认值，重复声明会产生
    # "duplicate MIME type" 警告，此处不要写。
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json
        application/wasm
        image/svg+xml;

    charset utf-8;

    # MIME：继承 http 级的 /etc/nginx/mime.types（nginx 1.21+ 已内置
    # application/wasm），不要在 server 级写 types { } 块——它会**覆盖**
    # 继承来的整张表，导致 html/css/js 掉回 application/octet-stream，
    # 并让 gzip 因类型不匹配而静默失效。

    # 带 hash 的构建产物：长缓存 + immutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # WASM 大模块：CacheFirst 策略的服务端配合
    location /wasm/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # sitemap / robots：不可长缓存
    location ~ ^/(sitemap\.xml|robots\.txt)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # SPA fallback：所有未知路径回落到 index.html
    # 注意用 $uri/index.html 而不是 $uri/ —— 后者会命中 index 模块的
    # 「目录自动补斜杠」逻辑，对 /tools 返回 301 → /tools/，
    # 与 SSG 产物的 canonical（无尾斜杠）不一致，还多一跳。
    location / {
        try_files $uri $uri/index.html /index.html;
        add_header Cache-Control "no-cache";
    }
}
