  <path d="M300 230 h32" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4" />
  <path d="M328 222 l10 8 l-10 8" fill="none" stroke="#94a3b8" stroke-width="2" />

  <!-- 占位标识 -->
  <rect x="232" y="352" width="176" height="34" rx="17" fill="#e2e8f0" />
  <text x="320" y="374" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#64748b">
    占位图 · 待替换
