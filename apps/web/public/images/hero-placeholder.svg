  <rect x="90" y="248" width="88" height="28" rx="6" fill="#0ea5e9" />
  <rect x="190" y="248" width="72" height="28" rx="6" fill="#e2e8f0" />

  <!-- 右栏：输出 -->
  <rect x="312" y="124" width="248" height="212" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />
  <rect x="330" y="146" width="140" height="10" rx="5" fill="#cbd5e1" />
  <rect x="330" y="176" width="60" height="8" rx="4" fill="#bae6fd" />
  <rect x="404" y="176" width="84" height="8" rx="4" fill="#e2e8f0" />
  <rect x="330" y="200" width="72" height="8" rx="4" fill="#bae6fd" />
  <rect x="416" y="200" width="72" height="8" rx="4" fill="#e2e8f0" />
